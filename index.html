<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todos</title>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>

  <div class="todo-app">

    <!-- App title -->
    <header class="todo-header">
      <h1>Todos</h1>
    </header>

    <!-- Search box: filters the visible task list by text -->
    <div class="todo-card">
      <input
        type="text"
        id="search-input"
        class="search-input"
        placeholder="Search tasks..."
      />
    </div>

    <!-- Main panel: new task input + toolbar + task list + footer -->
    <div class="todo-card">

      <!-- New task input -->
      <form id="new-todo-form" class="new-todo-form">
        <input
          type="text"
          id="new-todo-input"
          class="new-todo-input"
          placeholder="What needs to be done?"
          autocomplete="off"
        />
      </form>

      <!-- Toolbar: select/unselect all tasks at once -->
      <div class="toolbar">
        <label class="toggle-all-label">
          <input type="checkbox" id="toggle-all-checkbox" />
          <span>Mark all as complete</span>
        </label>
      </div>

      <!-- Task list is rendered here by JavaScript -->
      <ul id="todo-list" class="todo-list"></ul>

      <!-- Empty state, shown when there are no tasks to display -->
      <p id="empty-state" class="empty-state" hidden>No tasks found.</p>

      <!-- Footer: counters + clear completed action -->
      <footer class="todo-footer">
        <span id="items-left-count" class="items-left">0 items left</span>
        <button id="clear-completed-btn" class="clear-completed-btn" type="button">
          Clear 0 completed items
        </button>
      </footer>

    </div>

    <!-- Summary bar: totals for active / completed / deleted tasks -->
    <div class="todo-card stats-card">
      <span>Total: <strong id="total-count">0</strong></span>
      <span>Completed: <strong id="completed-count">0</strong></span>
      <span>Deleted: <strong id="deleted-count">0</strong></span>
    </div>

    <p class="hint">Double-click to edit a todo.</p>

    <p class="hint">
      <a
        class="source-link"
        href="https://github.com/saad-abdelhaleem/to-do-list"
        target="_blank"
        rel="noopener noreferrer"
        >
        <svg data-component="Octicon" aria-hidden="true" focusable="false" class="octicon octicon-mark-github" viewBox="0 0 24 24" width="32" height="32" fill="currentColor" display="inline-block" overflow="visible" style="vertical-align:text-bottom"><path d="M10.226 17.284c-2.965-.36-5.054-2.493-5.054-5.256 0-1.123.404-2.336 1.078-3.144-.292-.741-.247-2.314.09-2.965.898-.112 2.111.36 2.83 1.01.853-.269 1.752-.404 2.853-.404 1.1 0 1.999.135 2.807.382.696-.629 1.932-1.1 2.83-.988.315.606.36 2.179.067 2.942.72.854 1.101 2 1.101 3.167 0 2.763-2.089 4.852-5.098 5.234.763.494 1.28 1.572 1.28 2.807v2.336c0 .674.561 1.056 1.235.786 4.066-1.55 7.255-5.615 7.255-10.646C23.5 6.188 18.334 1 11.978 1 5.62 1 .5 6.188.5 12.545c0 4.986 3.167 9.12 7.435 10.669.606.225 1.19-.18 1.19-.786V20.63a2.9 2.9 0 0 1-1.078.224c-1.483 0-2.359-.808-2.987-2.313-.247-.607-.517-.966-1.034-1.033-.27-.023-.359-.135-.359-.27 0-.27.45-.471.898-.471.652 0 1.213.404 1.797 1.235.45.651.921.943 1.483.943.561 0 .92-.202 1.437-.719.382-.381.674-.718.944-.943"></path></svg>
        View source on GitHub
    </a>
    </p>

  </div>

  <script src="assets/js/storage.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
